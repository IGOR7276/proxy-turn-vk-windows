name: Build Windows

# Собирает Windows-бинарник WDTT и выкладывает его как artifact,
# чтобы можно было скачать и проверить вживую.
on:
  push:
    branches:
      - claude/wdtt-desktop-port-issue-7n8yaw
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build (windows/amd64)
        run: wails build -platform windows/amd64 -clean

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wdtt-windows-amd64
          path: build/bin/wdtt.exe
          if-no-files-found: error
