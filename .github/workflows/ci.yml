name: CI

# Q8: базовые проверки на каждый push/PR — сборка, vet, тесты и фронтенд.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Go (vet + tests)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # -unsafeptr=false: в COM-колбэках WebView2 uintptr неизбежно
      # превращается в unsafe.Pointer, и анализатор даёт ложные срабатывания.
      - name: Vet (desktop)
        run: go vet -unsafeptr=false ./...

      - name: Test (desktop)
        run: go test ./...

      - name: Vet (client core)
        working-directory: client
        run: go vet -unsafeptr=false ./...

      - name: Test (client core)
        working-directory: client
        run: go test ./...

  frontend:
    name: Frontend (tsc + lint + build)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Биндинги wailsjs в .gitignore — генерируем их перед tsc/build.
      - name: Generate Wails bindings
        working-directory: frontend
        run: npm run generate

      - name: Typecheck & build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
